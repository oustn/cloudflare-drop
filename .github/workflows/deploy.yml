name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  repository_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm test
      - run: pnpm exec tsc -p tsconfig.worker.json --noEmit
      - run: pnpm build:web
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        env:
          D1_NAME: ${{ vars.D1_NAME || secrets.D1_NAME }}
          D1_ID: ${{ secrets.D1_ID }}
          KV_NAMESPACE_NAME: ${{ vars.KV_NAMESPACE_NAME }}
          KV_ID: ${{ secrets.KV_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_BUCKET_JURISDICTION: ${{ vars.R2_BUCKET_JURISDICTION }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || secrets.CUSTOM_DOMAIN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SHARE_MAX_SIZE_IN_MB: ${{ vars.SHARE_MAX_SIZE_IN_MB }}
          RATE_LIMIT: ${{ vars.RATE_LIMIT }}
          LOOKUP_RATE_LIMIT: ${{ vars.LOOKUP_RATE_LIMIT }}
          SHARE_DURATION: ${{ vars.SHARE_DURATION }}
          STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: ./prepare.sh
          packageManager: pnpm
          command: deploy --env production
